<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  ROL ||--o{ USUARIO : tiene
  USUARIO ||--o{ VENTA : registra
  USUARIO ||--o{ MOVIMIENTO_INVENTARIO : ejecuta
  CATEGORIA ||--o{ PRODUCTO : clasifica
  PRODUCTO ||--o{ DETALLE_VENTA : incluido_en
  PRODUCTO ||--o{ MOVIMIENTO_INVENTARIO : afecta
  CLIENTE ||--o{ VENTA : realiza
  VENTA ||--o{ DETALLE_VENTA : contiene

  ROL {
    int id PK
    string nombre
    string descripcion
  }
  USUARIO {
    int id PK
    string nombre
    string apellido
    string email
    string password
    boolean activo
    datetime fechaCreacion
    int rol_id FK
  }
  CATEGORIA {
    int id PK
    string nombre
    string descripcion
    boolean activa
  }
  PRODUCTO {
    int id PK
    string nombre
    string descripcion
    string codigo
    decimal precioCompra
    decimal precioVenta
    int stock
    int stockMinimo
    string imagen
    boolean activo
    int categoria_id FK
  }
  CLIENTE {
    int id PK
    string nombre
    string apellido
    string telefono
    string email
    string direccion
    datetime fechaRegistro
    boolean activo
  }
  VENTA {
    int id PK
    datetime fecha
    decimal subtotal
    decimal impuestos
    decimal descuento
    decimal total
    string metodoPago
    int usuario_id FK
    int cliente_id FK
  }
  DETALLE_VENTA {
    int id PK
    int cantidad
    decimal precioUnitario
    decimal subtotal
    int venta_id FK
    int producto_id FK
  }
  MOVIMIENTO_INVENTARIO {
    int id PK
    string tipo
    int cantidad
    datetime fecha
    string motivo
    int producto_id FK
    int usuario_id FK
  }
  CONFIGURACION {
    int id PK
    string nombreNegocio
    string nit
    string direccion
    string telefono
    string logo
    string moneda
    decimal impuesto
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
