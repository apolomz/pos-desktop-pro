<div id="sd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `sequenceDiagram
  participant E as Empleado
  participant P as Pantalla POS
  participant PC as ProductController
  participant PS as ProductService
  participant PR as ProductRepository
  participant DB as PostgreSQL

  E->>P: Selecciona producto y confirma venta
  P->>PC: POST /ventas
  PC->>PS: registrarVenta()
  PS->>PR: buscarProducto()
  PR->>DB: SELECT producto
  DB-->>PR: datos del producto
  PR-->>PS: producto encontrado
  PS->>PS: actualizar stock
  PS->>PR: guardarDetalleVenta()
  PR->>DB: INSERT detalle_venta
  DB-->>PR: confirmación
  PR-->>PS: detalle guardado
  PS-->>PC: venta realizada
  PC-->>P: respuesta 200 OK
  P-->>E: pantalla actualizada`;
const { svg } = await mermaid.render('sd-svg', src);
document.getElementById('sd').innerHTML = svg;
</script>
